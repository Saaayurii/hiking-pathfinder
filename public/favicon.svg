<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#skyGradient)"/>

  <!-- Mountains -->
  <polygon points="20,70 50,30 65,50 80,70" fill="url(#mountainGradient)"/>
  <polygon points="50,30 60,45 70,30" fill="#9CA3AF"/>

  <!-- Snow caps -->
  <polygon points="48,32 50,30 52,32" fill="white" opacity="0.9"/>
  <polygon points="68,32 70,30 72,32" fill="white" opacity="0.9"/>

  <!-- Path/Trail -->
  <path d="M 30,65 Q 40,55 50,60 T 70,65"
        stroke="#EF4444"
        stroke-width="2.5"
        fill="none"
        stroke-linecap="round"
        stroke-dasharray="0,5"/>

  <!-- Waypoint markers -->
  <circle cx="30" cy="65" r="3" fill="#10B981" stroke="white" stroke-width="1"/>
  <circle cx="70" cy="65" r="3" fill="#EF4444" stroke="white" stroke-width="1"/>
</svg>
